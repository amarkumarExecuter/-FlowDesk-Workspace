<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-6 text-slate-900">

    <div class="w-full max-w-[440px] bg-white p-10 rounded-[2.5rem] shadow-2xl shadow-slate-200 border border-slate-100">
        <div class="text-center mb-10">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold mx-auto mb-4 shadow-lg shadow-indigo-100">F</div>
            <h2 class="text-3xl font-bold text-slate-900 tracking-tight">Sign In</h2>
            <p class="text-slate-500 mt-2 font-medium">Access your FlowDesk Workspace</p>
        </div>
        
        <!-- Email Form -->
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Email Address</label>
                <input type="email" id="email" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-600 outline-none transition-all" placeholder="name@company.com" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Password</label>
                <input type="password" id="password" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-0 ring-1 ring-slate-200 focus:ring-2 focus:ring-indigo-600 outline-none transition-all" placeholder="••••••••" required>
            </div>
            <button type="submit" id="loginBtn" class="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl hover:bg-indigo-600 transition-all shadow-xl">
                Continue to Workspace
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-100"></span></div>
            <div class="relative flex justify-center text-[10px] uppercase font-bold tracking-widest text-slate-400 bg-white px-4">Or secure login with</div>
        </div>

        <!-- Google Login Button -->
        <button id="googleBtn" type="button" class="w-full flex items-center justify-center gap-3 bg-white border border-slate-200 text-slate-700 font-bold py-4 rounded-2xl hover:bg-slate-50 transition-all shadow-sm">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6 h-6">
            Sign in with Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA75sjVya0r-vS4yoQrBvG2YF2ShLkyB_M",
            authDomain: "flowdesk-workspace.firebaseapp.com",
            projectId: "flowdesk-workspace",
            storageBucket: "flowdesk-workspace.firebasestorage.app",
            messagingSenderId: "691632052472",
            appId: "1:691632052472:web:b3101c5159e0463396430d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginForm = document.getElementById('login-form');
        const googleBtn = document.getElementById('googleBtn');

        // Email Login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .then(() => window.location.href = "dashboard.html")
                .catch((err) => alert("Error: " + err.message));
        });

        // Google Login
        googleBtn.addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then(() => window.location.href = "dashboard.html")
                .catch((err) => alert("Google Error: " + err.message));
        });
    </script>
</body>
</html>
