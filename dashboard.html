<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FlowDesk Workspace</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>FlowDesk</h2>
        </div>
        <ul class="nav-links">
            <li class="active"><a href="#">📊 Overview</a></li>
            <li><a href="#">📁 Projects</a></li>
            <li><a href="#">✅ Approvals</a></li>
            <li><a href="#">🚀 Client Delivery</a></li>
            <li><a href="#">⚙️ Settings</a></li>
        </ul>
        <div class="sidebar-footer">
            <button id="logoutBtn" class="btn btn-outline">Logout</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <header class="topbar">
            <button id="mobileMenuBtn" class="mobile-toggle">☰</button>
            <div class="search-bar">
                <input type="text" placeholder="Search projects, tasks...">
            </div>
            <div class="user-profile">
                <span id="userName">User</span>
                <div class="avatar">U</div>
            </div>
        </header>

        <div class="dashboard-widgets">
            <div class="widget">
                <h3>Active Projects</h3>
                <h1 id="activeProjectsCount">0</h1>
            </div>
            <div class="widget">
                <h3>Pending Approvals</h3>
                <h1 id="pendingApprovalsCount">0</h1>
            </div>
            <div class="widget">
                <h3>Delivery Rate</h3>
                <h1 id="deliveryRate">0%</h1>
            </div>
        </div>

        <section class="recent-activity">
            <h2>Recent Workflows</h2>
            <div class="table-container">
                <table id="workflowTable">
                    <thead>
                        <tr>
                            <th>Project Name</th>
                            <th>Client</th>
                            <th>Status</th>
                            <th>Due Date</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
