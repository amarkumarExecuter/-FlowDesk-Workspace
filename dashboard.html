<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk | Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-72 bg-slate-900 text-slate-400 flex flex-col border-r border-slate-800">
        <div class="p-8 flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">F</div>
            <span class="text-white text-2xl font-bold tracking-tight">FlowDesk</span>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <a href="#" class="flex items-center gap-4 bg-indigo-600 text-white px-4 py-3 rounded-2xl font-bold shadow-lg shadow-indigo-200">
                <i class="fas fa-grid-2"></i> Overview
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-800 hover:text-white transition-all font-medium">
                <i class="fas fa-layer-group"></i> Projects
            </a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-800 hover:text-white transition-all font-medium">
                <i class="fas fa-check-double"></i> Approvals
            </a>
        </nav>
        <div class="p-6 mt-auto border-t border-slate-800 text-center">
            <button id="logoutBtn" class="flex items-center gap-4 px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-2xl w-full transition-all font-bold">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Header -->
        <header class="h-24 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-10">
            <div>
                <h2 class="text-2xl font-bold text-slate-900">Workspace Overview</h2>
                <p class="text-slate-500 text-sm font-medium">Real-time Project Tracking</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-3 bg-slate-50 p-2 pr-4 rounded-2xl border border-slate-100">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold">U</div>
                    <span id="userName" class="text-sm font-bold text-slate-700">Loading...</span>
                </div>
            </div>
        </header>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto p-10 space-y-10">
            
            <!-- Stats Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h4 class="text-slate-500 font-bold uppercase text-xs mb-1">Real Projects</h4>
                    <p id="realProjectCount" class="text-4xl font-extrabold text-slate-900">0</p>
                </div>
                <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h4 class="text-slate-500 font-bold uppercase text-xs mb-1">Server Status</h4>
                    <p id="serverStatus" class="text-2xl font-bold text-emerald-500">Connecting...</p>
                </div>
                <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                    <h4 class="text-slate-500 font-bold uppercase text-xs mb-1">API Version</h4>
                    <p id="apiVersion" class="text-2xl font-bold text-indigo-600 text-center">v0.0.0</p>
                </div>
            </div>

            <!-- Table Section -->
            <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm p-10">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-bold text-slate-900">Recent Projects</h3>
                    <button onclick="toggleModal()" class="bg-indigo-600 text-
