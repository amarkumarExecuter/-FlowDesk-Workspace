<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowDesk | AI Intelligence Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fcfcfd; }
        .priority-high { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .priority-medium { background: #fef3c7; color: #f59e0b; border: 1px solid #fde68a; }
        .priority-low { background: #d1fae5; color: #10b981; border: 1px solid #a7f3d0; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-900">
    
    <!-- SIDEBAR -->
    <aside class="w-72 bg-slate-950 text-slate-400 flex flex-col border-r border-slate-800 hidden md:flex">
        <div class="p-8 flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg">F</div>
            <span class="text-white text-2xl font-bold tracking-tight">FlowDesk</span>
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <p class="px-4 text-[10px] font-bold uppercase tracking-widest text-slate-600 mb-4">Main Menu</p>
            <a href="#" onclick="showProjectList()" class="flex items-center gap-4 bg-indigo-600 text-white px-4 py-3 rounded-2xl font-bold shadow-lg shadow-indigo-500/20"><i class="fas fa-grid-2"></i> Dashboard</a>
            <a href="#" class="flex items-center gap-4 px-4 py-3 rounded-2xl hover:bg-slate-900 hover:text-white transition-all font-medium"><i class="fas fa-chart-pie text-indigo-400"></i> Analytics</a>
        </nav>
        <div class="p-6 mt-auto border-t border-slate-900">
            <button id="logoutBtn" class="flex items-center gap-4 px-4 py-3 text-red-400 hover:bg-red-500/10 rounded-2xl w-full transition-all font-bold">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-24 bg-white/80 backdrop-blur-md border-b border-slate-100 flex items-center justify-between px-10">
            <h2 class="text-2xl font-bold" id="pageTitle">Smart Workspace</h2>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p id="userName" class="text-sm font-bold text-indigo-600">User</p>
                    <p class="text-[10px] text-slate-400 font-bold uppercase">Pro Member</p>
                </div>
                <img id="userPhoto" src="https://via.placeholder.com/48" class="w-12 h-12 rounded-2xl border-2 border-indigo-100 shadow-sm object-cover">
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-10 space-y-10">
            
            <!-- OVERVIEW SECTION -->
            <div id="overviewSection" class="space-y-10">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm">
                        <h4 class="text-slate-400 font-bold uppercase text-[10px] tracking-widest">Active Projects</h4>
                        <p id="realProjectCount" class="text-4xl font-extrabold mt-1">0</p>
                    </div>
                    <!-- New Chart Box -->
                    <div class="bg-white p-8 rounded-[2rem] border border-slate-100 shadow-sm flex flex-col items-center justify-center relative">
                        <canvas id="projectChart" style="max-height: 80px;"></canvas>
                        <p class="text-[9px] font-bold text-slate-400 mt-2 uppercase">Task Completion Ratio</p>
                    </div>
                    <button onclick="toggleModal()" class="bg-slate-900 text-white rounded-[2rem] font-bold py-6 shadow-xl hover:bg-indigo-600 transition-all transform hover:-translate-y-1">
                        + New Project
                    </button>
                </div>

                <!-- AI BOX -->
                <div class="bg-slate-900 rounded-[2.5rem] p-10 text-white shadow-2xl border border-slate-800">
                    <h3 class="text-2xl font-bold mb-6 flex items-center gap-3"><i class="fas fa-robot text-indigo-400"></i> AI Workspace Advisor</h3>
                    <div class="flex flex-col md:flex-row gap-4 mb-6">
                        <input type="text" id="ai-input" class="flex-1 bg-slate-800 border border-slate-700 rounded-2xl px-6 py-4 text-white outline-none focus:ring-2 focus:ring-indigo-600 font-medium" placeholder="Ask AI: 'Suggest steps for a new Mobile App project'">
                        <button id="ai-btn" onclick="askAI()" class="bg-indigo-600 text-white px-10 py-4 rounded-2xl font-bold hover:bg-indigo-700 transition shadow-lg">Ask AI Advisor</button>
                    </div>
                    <div id="ai-response-box" class="p-6 bg-slate-800/50 rounded-2xl border border-slate-700 hidden">
                        <p id="ai-text" class="text-slate-200 text-sm leading-relaxed italic"></p>
                    </div>
                </div>

                <!-- PROJECT TABLE -->
                <div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm p-10">
                    <h3 class="text-xl font-bold mb-8">Current Workflows</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left" id="projectTable">
                            <thead><tr class="text-slate-400 text-[10px] font-bold uppercase tracking-widest border-b border-slate-50"><th class="pb-6 px-4">Project</th><th class="pb-6 px-4">Client</th><th class="pb-6 px-4 text-center">Progress</th><th class="pb-6 px-4 text-right">Settings</th></tr></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TASK VIEW -->
            <div id="taskView" class="hidden space-y-8">
                <button onclick="showProjectList()" class="text-indigo-600 font-bold mb-4 flex items-center gap-2 hover:underline"><i class="fas fa-arrow-left"></i> All Projects</button>
                
                <div class="bg-indigo-950 p-10 rounded-[2.5rem] text-white flex flex-col md:flex-row justify-between items-center gap-6 shadow-2xl">
                    <div>
                        <h2 id="currentProjectName" class="text-4xl font-extrabold mb-2 italic">Project Name</h2>
                        <span id="projectPercentage" class="bg-white/20 px-3 py-1 rounded-full text-xs font-bold">0% Completed</span>
                    </div>
                    <button id="ai-task-btn" onclick="generateAITasks()" class="bg-white text-indigo-900 px-8 py-4 rounded-2xl font-bold shadow-xl hover:bg-slate-100 transition">AI Task Suggester</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <h3 class="font-bold mb-6 text-slate-400 uppercase text-[10px] tracking-widest">Quick Add Task</h3>
                        <div class="space-y-4">
                            <input type="text" id="manual-task-input" class="w-full bg-slate-50 border p-4 rounded-2xl outline-none focus:ring-2 focus:ring-indigo-600 font-medium" placeholder="E.g. Finalize Brand Colors">
                            <button onclick="addManualTask()" id="addTaskBtn" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">Predict Priority & Add</button>
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm">
                        <h3 class="font-bold mb-6 text-slate-400 uppercase text-[10px] tracking-widest">Task Timeline</h3>
                        <div id="taskListDisplay" class="space-y-4"></div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- NEW PROJECT MODAL -->
    <div id="projectModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center z-50 p-6">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] p-10 shadow-2xl">
            <h3 class="text-2xl font-bold mb-6">Create New Workspace</h3>
            <form id="project-form" class="space-y-4">
                <input type="text" id="p-name" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border outline-none text-slate-900" placeholder="Project Name" required>
                <input type="text" id="p-client" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border outline-none text-slate-900" placeholder="Client Name" required>
                <div class="flex gap-4 mt-6">
                    <button type="button" onclick="toggleModal()" class="flex-1 py-4 text-slate-500 font-bold hover:text-slate-700">Cancel</button>
                    <button type="submit" class="flex-1 py-4 bg-indigo-600 text-white font-bold rounded-2xl shadow-lg">Start Project</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIREBASE & CORE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot, serverTimestamp, deleteDoc, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA75sjVya0r-vS4yoQrBvG2YF2ShLkyB_M",
            authDomain: "flowdesk-workspace.firebaseapp.com",
            projectId: "flowdesk-workspace",
            storageBucket: "flowdesk-workspace.firebasestorage.app",
            messagingSenderId: "691632052472",
            appId: "1:691632052472:web:b3101c5159e0463396430d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const RENDER_URL = "https://flowdesk-workspace.onrender.com";
        let currentPid = null;
        let myChart = null;

        // AUTH & PROFILE LOAD
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('userName').innerText = user.displayName || user.email;
                if(user.photoURL) document.getElementById('userPhoto').src = user.photoURL;
                loadProjects(user.uid);
            } else { window.location.href = "login.html"; }
        });

        document.getElementById('logoutBtn').onclick = () => signOut(auth).then(() => window.location.href = "login.html");

        // UI HELPERS
        window.toggleModal = () => { const m = document.getElementById('projectModal'); m.classList.toggle('hidden'); m.classList.toggle('flex'); };
        window.showProjectList = () => { document.getElementById('overviewSection').classList.remove('hidden'); document.getElementById('taskView').classList.add('hidden'); };

        // ANALYTICS CHART
        function updateChart(done, active) {
            const ctx = document.getElementById('projectChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [done, active || 1],
                        backgroundColor: ['#10b981', '#6366f1'],
                        borderWidth: 0
                    }]
                },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        }

        // LOAD PROJECTS REAL-TIME
        async function getProgress(pid) {
            const q = query(collection(db, "tasks"), where("projectId", "==", pid));
            const snap = await getDocs(q);
            if (snap.empty) return 0;
            const done = snap.docs.filter(d => d.data().completed).length;
            return { percent: Math.round((done / snap.size) * 100), total: snap.size, done };
        }

        function loadProjects(uid) {
            const q = query(collection(db, "projects"), where("userId", "==", uid));
            onSnapshot(q, async (snap) => {
                const body = document.getElementById('tableBody'); body.innerHTML = "";
                let globalDone = 0, globalTotal = 0;

                for (const d of snap.docs) {
                    const p = d.data(); 
                    const stats = await getProgress(d.id);
                    globalDone += stats.done || 0;
                    globalTotal += stats.total || 0;

                    body.innerHTML += `
                        <tr class="border-b border-slate-50 group hover:bg-slate-50 transition">
                            <td class="py-6 px-4 font-bold text-slate-800 cursor-pointer" onclick="openProject('${d.id}', '${p.name}')">${p.name}</td>
                            <td class="py-6 px-4 text-slate-400 font-medium">${p.client}</td>
                            <td class="py-6 px-4"><div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden"><div class="bg-indigo-600 h-full" style="width: ${stats.percent || 0}%"></div></div></td>
                            <td class="py-6 px-4 text-right"><button onclick="deleteProject('${d.id}')" class="text-slate-300 hover:text-red-500 transition"><i class="fas fa-trash-alt text-xs"></i></button></td>
                        </tr>`;
                }
                document.getElementById('realProjectCount').innerText = snap.size;
                updateChart(globalDone, globalTotal - globalDone);
            });
        }

        // TASK MANAGEMENT
        window.openProject = (id, name) => {
            currentPid = id; document.getElementById('currentProjectName').innerText = name;
            document.getElementById('overviewSection').classList.add('hidden');
            document.getElementById('taskView').classList.remove('hidden');
            loadTasks(id);
        };

        function loadTasks(pid) {
            const q = query(collection(db, "tasks"), where("projectId", "==", pid));
            onSnapshot(q, (snap) => {
                const list = document.getElementById('taskListDisplay'); list.innerHTML = "";
                let done = 0;
                snap.forEach((t) => {
                    const data = t.data(); if(data.completed) done++;
                    const pClass = `priority-${(data.priority || 'medium').toLowerCase()}`;
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-2xl border">
                            <div class="flex items-center gap-4">
                                <input type="checkbox" ${data.completed ? 'checked' : ''} onclick="toggleTask('${t.id}', ${data.completed})" class="w-5 h-5 cursor-pointer">
                                <span class="${data.completed ? 'line-through text-slate-300' : 'text-slate-700'} font-bold text-sm">${data.text}</span>
                                <span class="${pClass} text-[8px] font-bold px-2 py-0.5 rounded-full uppercase">${data.priority || 'MEDIUM'}</span>
                            </div>
                            <button onclick="deleteTask('${t.id}')" class="text-slate-300 hover:text-red-500">×</button>
                        </div>`;
                });
                document.getElementById('projectPercentage').innerText = `${snap.empty ? 0 : Math.round((done / snap.size) * 100)}% Completed`;
            });
        }

        window.toggleTask = async (id, current) => await updateDoc(doc(db, "tasks", id), { completed: !current });
        window.deleteTask = async (id) => await deleteDoc(doc(db, "tasks", id));
        window.deleteProject = async (id) => { if(confirm("Delete project?")) await deleteDoc(doc(db, "projects", id)); };

        // AI FEATURES
        window.askAI = async () => {
            const input = document.getElementById('ai-input'); const btn = document.getElementById('ai-btn'); const text = document.getElementById('ai-text'); const box = document.getElementById('ai-response-box');
            if(!input.value) return; btn.innerText = "Thinking..."; box.classList.remove('hidden'); text.innerText = "AI Advisor is analyzing...";
            try {
                const res = await fetch(`${RENDER_URL}/api/ai/chat`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ prompt: input.value }) });
                const data = await res.json(); text.innerText = data.response;
            } catch (e) { text.innerText = "AI Offline."; }
            btn.innerText = "Ask AI Advisor";
        };

        window.addManualTask = async () => {
            const input = document.getElementById('manual-task-input'); if(!input.value) return;
            const btn = document.getElementById('addTaskBtn'); btn.innerText = "AI Predicting...";
            try {
                const res = await fetch(`${RENDER_URL}/api/ai/chat`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: `Categorize task priority: "${input.value}". ONE WORD ONLY: HIGH, MEDIUM, or LOW.` })
                });
                const data = await res.json();
                const prio = data.response.toUpperCase().includes("HIGH") ? "HIGH" : data.response.toUpperCase().includes("LOW") ? "LOW" : "MEDIUM";
                await addDoc(collection(db, "tasks"), { projectId: currentPid, text: input.value, priority: prio, completed: false, createdAt: serverTimestamp() });
                input.value = "";
            } catch (e) { alert("Error"); }
            btn.innerText = "Predict Priority & Add";
        };

        window.generateAITasks = async () => {
            const btn = document.getElementById('ai-task-btn'); const pName = document.getElementById('currentProjectName').innerText;
            btn.innerText = "AI Thinking...";
            try {
                const res = await fetch(`${RENDER_URL}/api/ai/chat`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: `Give 3 short task names for "${pName}". Comma separated only.` })
                });
                const data = await res.json();
                const tasks = data.response.split(',');
                for (const t of tasks) { if(t.trim()) await addDoc(collection(db, "tasks"), { projectId: currentPid, text: t.trim(), priority: 'MEDIUM', completed: false, createdAt: serverTimestamp() }); }
            } catch (e) { }
            btn.innerText = "AI Task Suggester";
        };

        document.getElementById('project-form').onsubmit = async (e) => {
            e.preventDefault();
            await addDoc(collection(db, "projects"), { name: document.getElementById('p-name').value, client: document.getElementById('p-client').value, userId: auth.currentUser.uid, createdAt: serverTimestamp() });
            toggleModal(); document.getElementById('project-form').reset();
        };
    </script>
</body>
</html>
